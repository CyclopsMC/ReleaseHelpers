name: "CI"
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Lowest supported version (see README) and current LTS
        node: [18, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install GNU sed as gsed
        if: runner.os == 'macOS'
        run: brew install gnu-sed
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
      - name: Test
        run: node --test test/*.test.js

  real-repos:
    name: Real release rounds (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install GNU sed as gsed
        if: runner.os == 'macOS'
        run: brew install gnu-sed
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
      # Clones mods from GitHub and replays past release rounds with cc-release-chain --rehearse.
      # The spec reporter keeps the transcript of commands and output readable, in collapsible groups.
      - name: Replay real release rounds
        run: node --test --test-reporter=spec test/real/*.test.js
